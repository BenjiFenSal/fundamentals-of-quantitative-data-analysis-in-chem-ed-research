    distShapeToggle.addEventListener('click', ()=>{ distShape = distShape==='skewed' ? 'normal' : 'skewed'; renderDist(); });

    function show(idx){
      btns.forEach((b,i)=>b.classList.toggle('sel', i===idx));
      panels.forEach((p,i)=>p.setAttribute('opacity', i===idx ? '1' : '0'));
      distShapeToggle.style.display = idx===1 ? '' : 'none';
      if(idx===1) renderDist(); else caption.innerHTML = captions[idx];
    }
    btns.forEach((b,i)=>b.addEventListener('click', ()=>show(i)));
    show(0);

    // Similar variances panel: genuinely different widths (and, correctly, different peak heights for equal-ish area)
    const VAR_BASE_Y = 88;
    function varBell(cx, halfW, peakY){
      const w = halfW;
      return `M${(cx-w).toFixed(1)},${VAR_BASE_Y} C${(cx-w*0.62).toFixed(1)},${VAR_BASE_Y} ${(cx-w*0.38).toFixed(1)},${peakY} ${cx.toFixed(1)},${peakY} C${(cx+w*0.38).toFixed(1)},${peakY} ${(cx+w*0.62).toFixed(1)},${VAR_BASE_Y} ${(cx+w).toFixed(1)},${VAR_BASE_Y}`;
    }
    slideEl.querySelector('#assnVarCurveA').setAttribute('d', varBell(62, 52, 54));
    slideEl.querySelector('#assnVarCurveB').setAttribute('d', varBell(172, 20, 20));
  }

  // shared: draw two SEPARATE, stacked histograms (Group A above, Group B below) into an <g> — avoids overlapping/adjacent bars reading as one blended shape
  function drawStackedHist(container, valsA, valsB, lo, hi, nbins){
    const SVG_NS4 = 'http://www.w3.org/2000/svg';
    container.innerHTML = '';
    const X0 = 14, X1 = 226;
    const baseYA = 26, topYA = 4, baseYB = 62, topYB = 40;
    const binW = (X1-X0)/nbins;
    function bins(vals){
      const b = new Array(nbins).fill(0);
      vals.forEach(v=>{ const i=Math.min(nbins-1,Math.max(0,Math.floor(((v-lo)/(hi-lo))*nbins))); b[i]++; });
      return b;
    }
    const binsA = bins(valsA), binsB = bins(valsB);
    const maxCount = Math.max(...binsA, ...binsB, 1);
    function row(binCounts, baseY, topY, color){
      const availH = baseY - topY;
      for(let b=0;b<nbins;b++){
        const x0 = X0 + b*binW;
        const h = (binCounts[b]/maxCount)*availH;
        const rect = document.createElementNS(SVG_NS4,'rect');
        rect.setAttribute('x', x0.toFixed(1)); rect.setAttribute('y', (baseY-h).toFixed(1));
        rect.setAttribute('width', (binW*0.82).toFixed(1)); rect.setAttribute('height', h.toFixed(1));
        rect.setAttribute('fill', color); rect.setAttribute('opacity','0.85');
        container.appendChild(rect);
      }
    }
    row(binsA, baseYA, topYA, 'var(--accent)');
    row(binsB, baseYB, topYB, 'var(--try)');
  }

  // "Run the t-test on our data": Welch's t-test computed live from the real Group A/B marks
  const wtT = slideEl.querySelector('#wtT');
  if(wtT && !slideEl.dataset.wtInit){
    slideEl.dataset.wtInit = '1';
    drawStackedHist(slideEl.querySelector('#wtHist'), markA, markB, 30, 100, 11);
    const nA = markA.length, nB = markB.length;
    const mA = mean(markA), mB = mean(markB), sdA = sd(markA), sdB = sd(markB);
    const seDiff = Math.sqrt((sdA*sdA)/nA + (sdB*sdB)/nB);
    const t = (mA - mB) / seDiff;
    const df = Math.pow(seDiff,4) / ( Math.pow(sdA*sdA/nA,2)/(nA-1) + Math.pow(sdB*sdB/nB,2)/(nB-1) );
    const p = tTestTwoTailedP(Math.abs(t), df);
    slideEl.querySelector('#wtA').textContent = `n=${nA}, mean=${fmt(mA,1)}, SD=${fmt(sdA,1)}`;
    slideEl.querySelector('#wtB').textContent = `n=${nB}, mean=${fmt(mB,1)}, SD=${fmt(sdB,1)}`;
    wtT.textContent = fmt(t,2);
    slideEl.querySelector('#wtDf').textContent = fmt(df,1);
    slideEl.querySelector('#wtP').textContent = fmt(p,3);
    slideEl.querySelector('#wtCaption').innerHTML = p < 0.05
      ? `p = ${fmt(p,3)} &lt; 0.05 — reject H0: the gap is unlikely to be due to chance alone.`
      : `p = ${fmt(p,3)} &gt; 0.05 — fail to reject H0. Group B's displayed mean is higher, but the difference is not statistically significant at α = 0.05.`;
  }

  // "Alternative reality": pooled Student's t-test computed live from the altA/altB marks, plus a significance-threshold ruler
  const altT = slideEl.querySelector('#altT');
  if(altT && !slideEl.dataset.altInit){
    slideEl.dataset.altInit = '1';
    drawStackedHist(slideEl.querySelector('#altHist'), altA, altB, 30, 100, 11);
    const nA = altA.length, nB = altB.length;
    const mA = mean(altA), mB = mean(altB), sdA = sd(altA), sdB = sd(altB);
    const df = nA + nB - 2;
    const sp = Math.sqrt(((nA-1)*sdA*sdA + (nB-1)*sdB*sdB) / df);
    const t = (mA - mB) / (sp * Math.sqrt(1/nA + 1/nB));
    const p = tTestTwoTailedP(Math.abs(t), df);
    slideEl.querySelector('#altA').textContent = `n=${nA}, mean=${fmt(mA,1)}, SD=${fmt(sdA,1)}`;
    slideEl.querySelector('#altB').textContent = `n=${nB}, mean=${fmt(mB,1)}, SD=${fmt(sdB,1)}`;
    altT.textContent = fmt(t,2);
    slideEl.querySelector('#altDf').textContent = df;
    slideEl.querySelector('#altP').textContent = fmt(p,3);
    // position the marker on the log-scaled ruler (p from 5e-5 to 1, x from 14 to 226)
    const LOG_MIN = -4.3, LOG_MAX = 0, X0 = 14, X1 = 226;
    const pClamped = Math.max(5e-5, Math.min(1, p));
    const frac = (Math.log10(pClamped) - LOG_MIN) / (LOG_MAX - LOG_MIN);
    const mx = X0 + frac * (X1 - X0);
    const marker = slideEl.querySelector('#altMarker');
    marker.setAttribute('cx', mx.toFixed(1));
    const label = slideEl.querySelector('#altMarkerLabel');
    label.setAttribute('x', mx.toFixed(1));
    label.textContent = `p = ${fmt(p,3)}`;
    const caption = slideEl.querySelector('#altCaption');
    if(p < 0.001){
      caption.innerHTML = `p = ${fmt(p,3)} — significant at <i>both</i> α = 0.05 and the stricter α = 0.001.`;
    } else if(p < 0.05){
      caption.innerHTML = `p = ${fmt(p,3)} is below 0.05 (reject H0 at the common threshold) but above 0.001 (fail to reject at the stricter threshold) — the conclusion depends on the α chosen in advance.`;
    } else {
      caption.innerHTML = `p = ${fmt(p,3)} — not significant at either threshold.`;
    }
  }

  // "What if the data are strongly skewed?": skew slider morphs the right curve and moves mode/median/mean ticks
  const skewSlider = slideEl.querySelector('#skewSlider');
  if(skewSlider && !slideEl.dataset.skewInit){
    slideEl.dataset.skewInit = '1';
    const skewPath = slideEl.querySelector('#skewPath');
    const modeTick = slideEl.querySelector('#skewModeTick');
    const medianTick = slideEl.querySelector('#skewMedianTick');
    const meanTick = slideEl.querySelector('#skewMeanTick');
    const SYM_PTS = [[135,78],[144,78],[154,10],[170,10],[186,10],[196,78],[205,78]];
    const SKEW_PTS = [[125,78],[132,78],[140,15],[152,12],[168,8],[185,40],[225,76]];
    function lerp(a,b,t){ return a+(b-a)*t; }
    function render(v){
      const t = v/100;
      const pts = SYM_PTS.map((p,idx)=>{ const q = SKEW_PTS[idx]; return [lerp(p[0],q[0],t), lerp(p[1],q[1],t)]; });
      const d = `M${pts[0][0]},${pts[0][1]} C${pts[1][0]},${pts[1][1]} ${pts[2][0]},${pts[2][1]} ${pts[3][0]},${pts[3][1]} `+
                `C${pts[4][0]},${pts[4][1]} ${pts[5][0]},${pts[5][1]} ${pts[6][0]},${pts[6][1]}`;
      skewPath.setAttribute('d', d);
      const modeX = pts[3][0];
      const medianX = modeX + 5*t;
      const meanX = modeX + 16*t;
      [[modeTick,modeX],[medianTick,medianX],[meanTick,meanX]].forEach(([el,x])=>{
        el.setAttribute('x1', x); el.setAttribute('x2', x);
      });
    }
    render(parseFloat(skewSlider.value));
    skewSlider.addEventListener('input', ()=> render(parseFloat(skewSlider.value)));
  }

  // "Add a third group": real stacked histograms (A/B/C) from markA, markB, groupC, plus an assumptions reveal
  const anovaAssumpBtn = slideEl.querySelector('#anovaAssumpBtn');
  if(anovaAssumpBtn && !slideEl.dataset.anovaInit){
    slideEl.dataset.anovaInit = '1';
    const SVG_NS7 = 'http://www.w3.org/2000/svg';
    const ANOVA_ROWS = [
      {base:24, top:4, color:'var(--accent)'},
      {base:54, top:34, color:'var(--try)'},
      {base:84, top:64, color:'var(--ink-dim)'}
    ];
    const ANOVA_GROUPS = [markA, markB, groupC];
    const amx = v => 14 + (v/100)*(226-14);

    function drawStackedHist3(container, groups, rows, nbins){
      container.innerHTML = '';
      const X0=14, X1=226, binW=(X1-X0)/nbins;
      function binIt(vals){
        const b = new Array(nbins).fill(0);
        vals.forEach(v=>{ const i=Math.min(nbins-1,Math.max(0,Math.floor((v/100)*nbins))); b[i]++; });
        return b;
      }
      const binned = groups.map(binIt);
      const maxCount = Math.max(...binned.flat(), 1);
      groups.forEach((g,gi)=>{
        const {base,top,color} = rows[gi];
        const availH = base-top;
        binned[gi].forEach((c,b)=>{
          const x0 = X0+b*binW;
          const h = (c/maxCount)*availH;
          const rect = document.createElementNS(SVG_NS7,'rect');
          rect.setAttribute('x', x0.toFixed(1)); rect.setAttribute('y',(base-h).toFixed(1));
          rect.setAttribute('width',(binW*0.82).toFixed(1)); rect.setAttribute('height', h.toFixed(1));
          rect.setAttribute('fill', color); rect.setAttribute('opacity','0.85');
          container.appendChild(rect);
        });
      });
    }
    drawStackedHist3(slideEl.querySelector('#anova3Hist'), ANOVA_GROUPS, ANOVA_ROWS, 11);

    const anova = anovaOneWay(ANOVA_GROUPS);
    slideEl.querySelector('#anovaF').textContent = fmt(anova.F,1);
    slideEl.querySelector('#anovaP').textContent = anova.p < 0.001 ? '< 0.001' : fmt(anova.p,3);

    // a single static overlay: grand mean + each group's own mean, so the histograms show WHY the means differ
    const means = ANOVA_GROUPS.map(mean);
    const meansG = slideEl.querySelector('#anovaMeans');
    const grandX = amx(anova.grandMean);
    const gLine = document.createElementNS(SVG_NS7,'line');
    gLine.setAttribute('x1', grandX); gLine.setAttribute('x2', grandX);
    gLine.setAttribute('y1', 4); gLine.setAttribute('y2', 84);
    gLine.setAttribute('stroke','var(--op)'); gLine.setAttribute('stroke-width','1.3'); gLine.setAttribute('stroke-dasharray','4 3');
    meansG.appendChild(gLine);
    const gLabel = document.createElementNS(SVG_NS7,'text');
    gLabel.setAttribute('x', Math.min(grandX+2,178)); gLabel.setAttribute('y', 108); gLabel.setAttribute('font-size','6.5'); gLabel.setAttribute('fill','var(--op)');
    gLabel.textContent = 'grand mean';
    meansG.appendChild(gLabel);
    ANOVA_ROWS.forEach((r,i)=>{
      const mxv = amx(means[i]);
      const tick = document.createElementNS(SVG_NS7,'line');
      tick.setAttribute('x1', mxv); tick.setAttribute('x2', mxv);
      tick.setAttribute('y1', r.top); tick.setAttribute('y2', r.base);
      tick.setAttribute('stroke', r.color); tick.setAttribute('stroke-width','2.2');
      meansG.appendChild(tick);
    });

    const ab = welchPair(markA, markB), ac = welchPair(markA, groupC), bc = welchPair(markB, groupC);
    const bonf = p => Math.min(1, p*3);
    const sig = p => p < 0.001 ? 'p < 0.001' : `p = ${fmt(p,3)}`;
    const caption = slideEl.querySelector('#anovaCaption');
    const fTxt = fmt(anova.F,1), pTxt = anova.p<0.001?'p < 0.001':`p = ${fmt(anova.p,3)}`;
    const abP = bonf(ab.p), acP = bonf(ac.p), bcP = bonf(bc.p);
    caption.innerHTML = `F(${anova.dfBetween},${anova.dfWithin}) = ${fTxt}, ${pTxt} — reject the null hypothesis that all three population means are equal (dashed line = grand mean, ticks = group means); the ANOVA does not by itself identify which groups differ. Bonferroni-adjusted pairwise tests (three comparisons): A vs. B not significant (${sig(abP)}); A vs. C and B vs. C both significant (${sig(acP)}) — Group C (no guidance) scores lower than either prepared group.`;

    // "Show ANOVA assumptions" reveal, same pattern as the Group A/B flip-to-reveal elsewhere
    const assumpBox = slideEl.querySelector('#anovaAssumpBox');
    anovaAssumpBtn.addEventListener('click', ()=>{
      const shown = assumpBox.classList.toggle('shown');
      anovaAssumpBtn.textContent = shown ? '🔍 Hide ANOVA assumptions' : '🔍 Show ANOVA assumptions';
    });
  }

  // shared: a simple two-bar percentage chart (used by the chi-square and McNemar slides)
  function drawPctBars(container, pairs){
    const SVG_NS8 = 'http://www.w3.org/2000/svg';
    container.innerHTML = '';
    const X0=14, X1=226, baseY=40, topY=6, barW=(X1-X0)/pairs.length*0.5;
    pairs.forEach((pr,i)=>{
      const cx = X0 + (i+0.5)*((X1-X0)/pairs.length);
      const h = (pr.pct/100)*(baseY-topY);
      const rect = document.createElementNS(SVG_NS8,'rect');
      rect.setAttribute('x', (cx-barW/2).toFixed(1)); rect.setAttribute('y', (baseY-h).toFixed(1));
      rect.setAttribute('width', barW.toFixed(1)); rect.setAttribute('height', h.toFixed(1));
      rect.setAttribute('fill', pr.color); rect.setAttribute('opacity','0.85'); rect.setAttribute('rx','2');
      container.appendChild(rect);
      const label = document.createElementNS(SVG_NS8,'text');
      label.setAttribute('x', cx); label.setAttribute('y', baseY-h-3);
      label.setAttribute('text-anchor','middle'); label.setAttribute('font-size','7.5'); label.setAttribute('font-weight','700');
      label.setAttribute('fill', pr.color);
      label.textContent = `${pr.pct.toFixed(0)}%`;
      container.appendChild(label);
      const name = document.createElementNS(SVG_NS8,'text');
      name.setAttribute('x', cx); name.setAttribute('y', baseY+9);
      name.setAttribute('text-anchor','middle'); name.setAttribute('font-size','7'); name.setAttribute('fill','var(--ink-dim)');
      name.textContent = pr.label;
      container.appendChild(name);
    });
  }

  // "Independent groups, categorical outcome": chi-square test of independence on the cmcCheck counts
  const chiStat = slideEl.querySelector('#chiStat');
  if(chiStat && !slideEl.dataset.chiInit){
    slideEl.dataset.chiInit = '1';
    const {nA, passA, nB, passB} = cmcCheck;
    const failA = nA-passA, failB = nB-passB;
    slideEl.querySelector('#chiPassA').textContent = passA;
    slideEl.querySelector('#chiFailA').textContent = failA;
    slideEl.querySelector('#chiPassB').textContent = passB;
    slideEl.querySelector('#chiFailB').textContent = failB;
    const N = nA+nB;
    const denomChi = (passA+failA)*(passB+failB)*(passA+passB)*(failA+failB);
    // Uncorrected Pearson chi-square statistic for the 2x2 table.
    const chi2 = N*Math.pow(passA*failB - failA*passB, 2) / denomChi;
    const chi2Uncorrected = chi2;
    const p = chiSqP1(chi2);
    chiStat.textContent = fmt(chi2,2);
    slideEl.querySelector('#chiP').textContent = p<0.001 ? '< 0.001' : fmt(p,3);
    drawPctBars(slideEl.querySelector('#chiBars'), [
      {pct: 100*passA/nA, label:'Group A', color:'var(--accent)'},
      {pct: 100*passB/nB, label:'Group B', color:'var(--try)'}
    ]);
    // difference in proportions, 95% CI (Wald), and effect size (phi)
    const pA = passA/nA, pB = passB/nB, diffP = pB - pA;
    const seDiffP = Math.sqrt(pA*(1-pA)/nA + pB*(1-pB)/nB);
    const ciLoP = diffP - 1.96*seDiffP, ciHiP = diffP + 1.96*seDiffP;
    const phi = Math.sqrt(chi2Uncorrected/N);
    slideEl.querySelector('#chiDiff').textContent = `${diffP>=0?'+':''}${fmt(diffP*100,1)} pp`;
    slideEl.querySelector('#chiDiffCI').textContent = `${fmt(ciLoP*100,1)} to ${fmt(ciHiP*100,1)} pp`;
    const pTxtChi = p<0.001 ? 'p &lt; 0.001' : `p = ${fmt(p,3)}`;
    const phiSize = phi<0.1?'negligible':phi<0.3?'small':phi<0.5?'small-to-medium':'medium-or-larger';
    slideEl.querySelector('#chiCaption').innerHTML = `Pearson's χ² compares observed counts with counts expected if pass/fail were independent of group. ${pTxtChi} — ` + (p < 0.05
      ? `below 0.05, so reject H0: pass rate is associated with group (${Math.round(100*passB/nB)}% passed with the tutorial vs. ${Math.round(100*passA/nA)}% without). The 95% CI for the difference is ${fmt(ciLoP*100,1)} to ${fmt(ciHiP*100,1)} percentage points. This is an association; it supports a causal claim only if the study design justifies one. Effect size φ&nbsp;=&nbsp;${fmt(phi,2)}; its practical importance depends on context.`
      : `above 0.05, so fail to reject H0: not enough evidence pass rate differs by group. The 95% CI for the gap (${fmt(ciLoP*100,1)} to ${fmt(ciHiP*100,1)} percentage points) includes zero, so no real difference — nor a sizeable one — can be ruled out; a larger sample would narrow this.`);
    const chiAssumpBtn = slideEl.querySelector('#chiAssumpBtn'), chiAssumpBox = slideEl.querySelector('#chiAssumpBox');
    chiAssumpBtn.addEventListener('click', ()=>{
      const shown = chiAssumpBox.classList.toggle('shown');
      chiAssumpBtn.textContent = shown ? '🔍 Hide assumptions' : '🔍 Show assumptions';
    });
  }

  // "Paired design, categorical outcome": McNemar's test on the mcnemarCells counts
  const mcStat = slideEl.querySelector('#mcStat');
  if(mcStat && !slideEl.dataset.mcInit){
    slideEl.dataset.mcInit = '1';
    const {bothCorrect, startCorrectEndIncorrect, startIncorrectEndCorrect, bothIncorrect} = mcnemarCells;
    slideEl.querySelector('#mcBothCorrect').textContent = bothCorrect;
    slideEl.querySelector('#mcSCEI').textContent = startCorrectEndIncorrect;
    slideEl.querySelector('#mcSIEC').textContent = startIncorrectEndCorrect;
    slideEl.querySelector('#mcBothIncorrect').textContent = bothIncorrect;
    const b = startCorrectEndIncorrect, c = startIncorrectEndCorrect;
    const n = bothCorrect+b+c+bothIncorrect;
    // Continuity-corrected McNemar statistic (the standard default, e.g. R's mcnemar.test()).
    const chi2 = Math.pow(Math.abs(b-c)-1, 2)/(b+c);
    const p = chiSqP1(chi2);
    mcStat.textContent = fmt(chi2,2);
    slideEl.querySelector('#mcP').textContent = p<0.0001 ? '< 0.0001' : fmt(p,4);
    const startPct = 100*(bothCorrect+b)/n, endPct = 100*(bothCorrect+c)/n;
    drawPctBars(slideEl.querySelector('#mcBars'), [
      {pct: startPct, label:'Start', color:'var(--accent)'},
      {pct: endPct, label:'End', color:'var(--try)'}
    ]);
    // paired difference in proportions, 95% CI (based on the discordant pairs)
    const diffPm = (c-b)/n;
    const seDiffM = Math.sqrt((b+c) - Math.pow(b-c,2)/n) / n;
    const ciLoM = diffPm - 1.96*seDiffM, ciHiM = diffPm + 1.96*seDiffM;
    slideEl.querySelector('#mcDiff').textContent = `${diffPm>=0?'+':''}${fmt(diffPm*100,1)} pp`;
    slideEl.querySelector('#mcDiffCI').textContent = `${fmt(ciLoM*100,1)} to ${fmt(ciHiM*100,1)} pp`;
    const pTxtMc = p<0.0001 ? 'p &lt; 0.0001' : `p = ${fmt(p,4)}`;
    slideEl.querySelector('#mcCaption').innerHTML = `McNemar's χ² uses the ${b+c} students who changed (${b} correct→incorrect, ${c} incorrect→correct). Under H0, the two directions of change are equally likely. ${pTxtMc} — ` + (p < 0.05
      ? `below 0.05, so reject H0: the proportion correct was higher at the end (${Math.round(endPct)}%) than at the start (${Math.round(startPct)}%). The 95% CI for the increase is ${fmt(ciLoM*100,1)} to ${fmt(ciHiM*100,1)} percentage points. This pre/post result alone does not establish that the lab caused the change.`
      : `above 0.05, so fail to reject H0: no significant change from start to end. The 95% CI for the change (${fmt(ciLoM*100,1)} to ${fmt(ciHiM*100,1)} percentage points) straddles zero, so a real shift in either direction is still plausible — only more discordant pairs (bigger n) would narrow it.`);
    const mcAssumpBtn = slideEl.querySelector('#mcAssumpBtn'), mcAssumpBox = slideEl.querySelector('#mcAssumpBox');
    mcAssumpBtn.addEventListener('click', ()=>{
      const shown = mcAssumpBox.classList.toggle('shown');
      mcAssumpBtn.textContent = shown ? '🔍 Hide assumptions' : '🔍 Show assumptions';
    });
  }

  // "Paired design, continuous outcome": paired t-test on quizPre/quizPost (one-sample t-test on the differences)
  const ptT = slideEl.querySelector('#ptT');
  if(ptT && !slideEl.dataset.ptInit){
    slideEl.dataset.ptInit = '1';
    const diffs = quizPost.map((v,i)=> v - quizPre[i]);
    const mDiff = mean(diffs), sdDiff = sd(diffs), n = diffs.length;
    const se = sdDiff/Math.sqrt(n);
    const t = mDiff/se, df = n-1;
    const p = tTestTwoTailedP(Math.abs(t), df);
    slideEl.querySelector('#ptMeanDiff').textContent = (mDiff>=0?'+':'') + fmt(mDiff,1);
    slideEl.querySelector('#ptSDDiff').textContent = fmt(sdDiff,1);
    ptT.textContent = fmt(t,2);
    slideEl.querySelector('#ptP').textContent = p<0.001 ? '< 0.001' : fmt(p,3);
    // histogram of differences, range -20 to +30, mapped onto the shared axis (120 = 0)
    const SVG_NS9 = 'http://www.w3.org/2000/svg';
    const histG = slideEl.querySelector('#ptHist');
    histG.innerHTML = '';
    const LO=-20, HI=30, X0=14, X1=226, nbins=10;
    const binW = (X1-X0)/nbins;
    const bins = new Array(nbins).fill(0);
    diffs.forEach(v=>{ const i=Math.min(nbins-1,Math.max(0,Math.floor(((v-LO)/(HI-LO))*nbins))); bins[i]++; });
    const maxCount = Math.max(...bins,1);
    bins.forEach((c,i)=>{
      const x0 = X0+i*binW;
      const h = (c/maxCount)*42;
      const rect = document.createElementNS(SVG_NS9,'rect');
      rect.setAttribute('x', x0.toFixed(1)); rect.setAttribute('y', (48-h).toFixed(1));
      rect.setAttribute('width', (binW*0.82).toFixed(1)); rect.setAttribute('height', h.toFixed(1));
      rect.setAttribute('fill', 'var(--accent)'); rect.setAttribute('opacity','0.85');
      histG.appendChild(rect);
    });
    const [ciLoPt, ciHiPt] = tCI95(mDiff, se, df);
    const cohenD = mDiff/sdDiff;
    slideEl.querySelector('#ptCI').textContent = `${fmt(ciLoPt,1)} to ${fmt(ciHiPt,1)}`;
    slideEl.querySelector('#ptD').textContent = fmt(cohenD,2);
    const dSize = Math.abs(cohenD)<0.2?'negligible':Math.abs(cohenD)<0.5?'small':Math.abs(cohenD)<0.8?'medium':'large';
    const pTxtPt = p<0.001 ? 'p &lt; 0.001' : `p = ${fmt(p,3)}`;
    slideEl.querySelector('#ptCaption').innerHTML = `The paired t statistic compares the mean within-student change with its standard error. ${pTxtPt} — ` + (p < 0.05
      ? `below 0.05, so reject H0: scores were higher at post-test by an estimated mean of ${fmt(mDiff,1)} points. The 95% CI is ${fmt(ciLoPt,1)} to ${fmt(ciHiPt,1)} points. This pre/post result shows a score change but, without a comparison group, does not establish what caused it.`
      : `above 0.05, so fail to reject H0: no significant mean change. The 95% CI (${fmt(ciLoPt,1)} to ${fmt(ciHiPt,1)} points) still includes zero, so a real change of meaningful size cannot be ruled out — only that this sample does not pin it down.`);
    const ptAssumpBtn = slideEl.querySelector('#ptAssumpBtn'), ptAssumpBox = slideEl.querySelector('#ptAssumpBox');
    ptAssumpBtn.addEventListener('click', ()=>{
      const shown = ptAssumpBox.classList.toggle('shown');
      ptAssumpBtn.textContent = shown ? '🔍 Hide assumptions' : '🔍 Show assumptions';
    });
  }
}

/* ============================ TITLE SLIDE: 3D SCATTER ============================ */
let titleRafId = null, titleStartTs = null;
const TITLE_N = 48;
const titlePoints = (() => {
  // deterministic PRNG so the cloud is stable across reloads
  let seed = 7;
  const rnd = () => { seed = (seed*9301+49297) % 233280; return seed/233280; };
  const pts = [];
  for(let i=0;i<TITLE_N;i++){
    const t = -1.3 + rnd()*2.6;                 // position along the fit line
    const r = (0.08 + 0.42*(t/1.3)*(t/1.3)) * (0.35 + rnd()*0.8); // offset, band flares at the ends
    const phi = rnd()*Math.PI*2;
    pts.push({
      t,
      x: t,
      y: 0.55*t + r*Math.cos(phi),
      z: r*Math.sin(phi),
    });
  }
  return pts;
})();

function project3D(p, angle, tilt, zoom, W, H, panX, panY){
  const x1 = p.x*Math.cos(angle) + p.z*Math.sin(angle);
  const z1 = -p.x*Math.sin(angle) + p.z*Math.cos(angle);
  const y2 = p.y*Math.cos(tilt) - z1*Math.sin(tilt);
  const z2 = p.y*Math.sin(tilt) + z1*Math.cos(tilt);
  const focal = 4.2;
  const persp = focal/(focal+z2);
  const scale = persp*zoom*150;
  return { sx: W/2+panX + x1*scale, sy: H/2+panY - y2*scale, depth: z2, scale: persp };
}

function drawTitleScatter(ctx, W, H, elapsed){
  ctx.clearRect(0,0,W,H);
  const angle = elapsed*0.00011;
  const tilt = 0.5;
  const zoom = 1 + 0.14*Math.sin(elapsed*2*Math.PI/19000);
  const panX = 16*Math.sin(elapsed*2*Math.PI/27000);
  const panY = 9*Math.cos(elapsed*2*Math.PI/31000);
  const visibleCount = Math.round(TITLE_N*0.3 + TITLE_N*0.68*(0.5 - 0.5*Math.cos(elapsed*2*Math.PI/17000)));

  // floor grid, for a sense of 3D space
  ctx.strokeStyle = 'rgba(255,255,255,0.045)'; ctx.lineWidth = 1;
  for(let g=-1.4; g<=1.4001; g+=0.35){
    ctx.beginPath();
    let p0 = project3D({x:g,y:-1.0,z:-1.4}, angle, tilt, zoom, W, H, panX, panY);
    let p1 = project3D({x:g,y:-1.0,z: 1.4}, angle, tilt, zoom, W, H, panX, panY);
    ctx.moveTo(p0.sx,p0.sy); ctx.lineTo(p1.sx,p1.sy); ctx.stroke();
    ctx.beginPath();
    p0 = project3D({x:-1.4,y:-1.0,z:g}, angle, tilt, zoom, W, H, panX, panY);
    p1 = project3D({x: 1.4,y:-1.0,z:g}, angle, tilt, zoom, W, H, panX, panY);
    ctx.moveTo(p0.sx,p0.sy); ctx.lineTo(p1.sx,p1.sy); ctx.stroke();
  }

  // confidence-interval volume: stacked rings along the fit line, flaring at the ends
  ctx.fillStyle = 'rgba(94,234,212,0.05)';
  for(let ti=-1.3; ti<=1.3001; ti+=0.065){
    const r = 0.08 + 0.42*(ti/1.3)*(ti/1.3);
    ctx.beginPath();
    for(let k=0;k<=16;k++){
      const ph = k/16*Math.PI*2;
      const p = project3D({x:ti, y:0.55*ti+r*Math.cos(ph), z:r*Math.sin(ph)}, angle, tilt, zoom, W, H, panX, panY);
      if(k===0) ctx.moveTo(p.sx,p.sy); else ctx.lineTo(p.sx,p.sy);
    }
    ctx.closePath(); ctx.fill();
  }

  // the fit line itself
  ctx.strokeStyle = 'rgba(251,191,36,0.55)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for(let ti=-1.3; ti<=1.3001; ti+=0.05){
    const p = project3D({x:ti,y:0.55*ti,z:0}, angle, tilt, zoom, W, H, panX, panY);
    if(ti<=-1.3) ctx.moveTo(p.sx,p.sy); else ctx.lineTo(p.sx,p.sy);
  }
  ctx.stroke();

  // scatter points, sorted back-to-front so nearer dots draw on top
  const projected = titlePoints.slice(0, visibleCount).map(p => ({ pt:p, proj: project3D(p, angle, tilt, zoom, W, H, panX, panY) }));
  projected.sort((a,b)=> a.proj.depth - b.proj.depth);
  projected.forEach(({proj})=>{
    const alpha = 0.3 + 0.4*proj.scale;
    const rad = 2.1*proj.scale + 1.3;
    ctx.beginPath();
    ctx.fillStyle = `rgba(94,234,212,${alpha.toFixed(3)})`;
    ctx.arc(proj.sx, proj.sy, rad, 0, Math.PI*2);
    ctx.fill();
  });
}

function startTitleScatter(){
  const canvas = document.getElementById('titleCanvas');
  if(!canvas || titleRafId) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  titleStartTs = null;
  function frame(ts){
    if(!titleStartTs) titleStartTs = ts;
    drawTitleScatter(ctx, W, H, ts-titleStartTs);
    titleRafId = requestAnimationFrame(frame);
  }
  titleRafId = requestAnimationFrame(frame);
}
function stopTitleScatter(){
  if(titleRafId){ cancelAnimationFrame(titleRafId); titleRafId = null; }
}

goTo(0);
</script>
